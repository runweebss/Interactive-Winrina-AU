
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Home Screen</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: #f5f5f5;
  color: white;
}

.home-screen {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  margin: auto;
  padding: 35px 22px 25px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* WEATHER WIDGET */
.weather {
  width: 100%;
  min-height: 190px;
  padding: 20px;
  border-radius: 28px;
  background: rgba(90, 100, 120, 0.78);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.weather-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.city {
  font-size: 15px;
  opacity: .85;
}

.temperature {
  font-size: 52px;
  font-weight: 300;
  line-height: 1.2;
}

.weather-info {
  text-align: right;
  font-size: 13px;
}

.forecast {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  text-align: center;
  font-size: 11px;
  gap: 4px;
}

.forecast div {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* APPLICATION GRID */
.apps-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: 94px 94px 108px;
  column-gap: 12px;
  row-gap: 20px;
  align-items: start;
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.app-icon {
  width: 100%;
  max-width: 76px;
  aspect-ratio: 1;
  border-radius: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: white;
  font-size: 37px;
  font-weight: 600;
  box-shadow: 0 3px 8px #00000012;
}

.app-name {
  font-size: 12px;
  color: white;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 4px #00000040;
}

.badge {
  position: absolute;
  top: -7px;
  right: -5px;
  min-width: 23px;
  height: 23px;
  border-radius: 20px;
  background: #ff3b30;
  color: white;
  font-size: 12px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff55;
}

/* APP COLORS */
.whatsapp {
  background: #16c968;
  font-size: 38px;
}

.calendar {
  background: #fff;
  color: #ff5149;
  overflow: hidden;
}

.calendar strong {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 5px;
  background: #ff554d;
  color: white;
  font-size: 11px;
  text-align: center;
}

.calendar span {
  margin-top: 13px;
  font-size: 33px;
  color: #333;
}

.instagram {
  background: linear-gradient(
    35deg, #ffdc80, #fcaf45,
    #f77737, #e1306c, #833ab4, #405de6
  );
}

.x-app {
  background: #080808;
  font-family: Arial, sans-serif;
  font-weight: 400;
}

.spotify {
  background: #080808;
  color: #1ed760;
  font-size: 43px;
}

.photos {
  background: #fff;
  color: #ff554c;
  font-size: 38px;
}

.notes {
  background: linear-gradient(
    to bottom, #ffcf42 0 19%, #fff 19% 100%
  );
  color: #666;
  font-size: 28px;
}

.youtube {
  background: #fff;
  color: #ff0808;
  font-size: 36px;
}

/* MUSIC WIDGET */
.music-widget {
  grid-column: 3 / 5;
  grid-row: 1 / 3;
  height: 208px;
  border-radius: 25px;
  padding: 14px;
  background: linear-gradient(145deg, #a34aff, #5411ce);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.music-cover {
  width: 65px;
  height: 65px;
  border-radius: 12px;
  background: linear-gradient(135deg, #222, #888);
  display: grid;
  place-items: center;
  font-size: 30px;
}

.music-title {
  font-size: 13px;
  font-weight: 600;
}

.music-subtitle {
  font-size: 11px;
  opacity: .8;
  margin-top: 3px;
}

.play-button {
  width: fit-content;
  border-radius: 30px;
  background: #ffffff25;
  padding: 8px 13px;
  font-size: 12px;
}

/* LOWER SPACE */
.empty-space {
  flex: 1;
  min-height: 100px;
}

/* BOTTOM DOCK */
.dock {
  width: 100%;
  min-height: 92px;
  padding: 12px 8px;
  border-radius: 28px;
  background: rgba(255,255,255,.30);
  backdrop-filter: blur(25px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  align-items: center;
}

.dock .app-icon {
  width: 100%;
  max-width: 68px;
  border-radius: 20px;
  font-size: 34px;
}

.camera {
  background: linear-gradient(#f7f7fa, #d8d8df);
  color: #25252a;
}

.calculator {
  background: #292929;
  color: #ff9f0a;
}

.gmail {
  background: white;
  color: #e84135;
  font-size: 36px;
}

.settings {
  background: linear-gradient(#9999a3, #686873);
  color: white;
}

@media (max-width: 360px) {
  .home-screen {
    padding: 24px 14px 18px;
    gap: 20px;
  }

  .apps-grid {
    column-gap: 8px;
    grid-template-rows: 84px 84px 96px;
  }

  .app-name {
    font-size: 10px;
  }

  .music-widget {
    height: 188px;
  }

  .app-icon {
    border-radius: 16px;
  }
}
</style>
</head>

<body>

<main class="home-screen">

  <!-- WEATHER -->
  <section class="weather">
    <div class="weather-top">
      <div>
        <div class="city">Cupertino</div>
        <div class="temperature">61°</div>
      </div>
      <div class="weather-info">
        ☁️<br>
        Cloudy<br>
        H:62° L:52°
      </div>
    </div>

    <div class="forecast">
      <div>2 PM <span>☁️</span>61°</div>
      <div>3 PM <span>☁️</span>62°</div>
      <div>4 PM <span>☁️</span>61°</div>
      <div>5 PM <span>☁️</span>62°</div>
      <div>6 PM <span>☁️</span>62°</div>
      <div>7 PM <span>☁️</span>61°</div>
    </div>
  </section>

  <!-- APPS -->
  <section class="apps-grid">

    <div class="app">
      <div class="app-icon whatsapp">◉</div>
      <span class="app-name">WhatsApp</span>
    </div>

    <div class="app">
      <div class="app-icon calendar">
        <strong>Tue</strong>
        <span>9</span>
      </div>
      <span class="app-name">Calendar</span>
    </div>

    <!-- MUSIC WIDGET -->
    <div class="music-widget">
      <div class="music-cover">♫</div>
      <div>
        <div class="music-title">Sleep Sounds</div>
        <div class="music-subtitle">Sleep</div>
      </div>
      <div class="play-button">▶ Play</div>
    </div>

    <div class="app">
      <div class="app-icon instagram">◎</div>
      <span class="app-name">Instagram</span>
    </div>

    <div class="app">
      <div class="app-icon x-app">𝕏</div>
      <span class="app-name">X</span>
    </div>

    <div class="app">
      <div class="app-icon spotify">≋</div>
      <span class="app-name">Spotify</span>
    </div>

    <div class="app">
      <div class="app-icon photos">✿</div>
      <span class="app-name">Photos</span>
    </div>

    <div class="app">
      <div class="app-icon notes">☰</div>
      <span class="app-name">Notes</span>
    </div>

    <div class="app">
      <div class="app-icon youtube">▶</div>
      <span class="app-name">YouTube</span>
    </div>

  </section>

  <!-- EMPTY SPACE -->
  <div class="empty-space"></div>

  <!-- DOCK -->
  <nav class="dock">

    <div class="app">
      <div class="app-icon camera">📷</div>
    </div>

    <div class="app">
      <div class="app-icon calculator">▦</div>
    </div>

    <div class="app">
      <div class="app-icon gmail">M</div>
    </div>

    <div class="app">
      <div class="app-icon settings">⚙</div>
    </div>

  </nav>

</main>

</body>
</html>
