<script>
// Live Real-Time Clock
function updateClock() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  
  document.getElementById('statusClock').textContent = `${hours}:${minutes}`;
  document.getElementById('bigClockText').textContent = `${hours}:${minutes}`;

  const options = { weekday: 'long', month: 'long', day: 'numeric' };
  document.getElementById('dateText').textContent = now.toLocaleDateString('en-US', options);
}
setInterval(updateClock, 1000);
updateClock();

// Dynamic Island Interactive Toggle
let islandExpanded = false;
function toggleIsland(forceState = null) {
  const island = document.getElementById('dynamicIsland');
  const left = document.getElementById('islandContentLeft');
  const right = document.getElementById('islandContentRight');
  
  islandExpanded = forceState !== null ? forceState : !islandExpanded;
  if (islandExpanded) {
    island.classList.add('expanded');
    left.classList.remove('hidden');
    left.classList.add('flex');
    right.classList.remove('hidden');
  } else {
    island.classList.remove('expanded');
    left.classList.add('hidden');
    left.classList.remove('flex');
    right.classList.add('hidden');
  }
}
