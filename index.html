
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#d8cbb5">
<title>Mavin's iPhone</title>
<style>
:root {
  --text: #fff;
  --glass: rgba(242, 239, 231, .43);
  --blue: #087cff;
}
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background: #ddd3c4;
  color: white;
  user-select: none;
}

button { font: inherit; cursor: pointer; }

.phone {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  min-height: 650px;
  margin: auto;
  overflow: hidden;
  isolation: isolate;
  background: #b9a990;
}

.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-image:
    linear-gradient(to bottom, rgba(0,0,0,.10), transparent 35%, rgba(0,0,0,.08)),
    url("camera-wallpaper.jpg");
  background-size: cover;
  background-position: center;
}

.statusbar {
  height: 49px;
  padding: 14px 27px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -.3px;
  text-shadow: 0 1px 5px #0004;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
}

.battery {
  width: 23px;
  height: 11px;
  border: 1.4px solid white;
  border-radius: 3px;
  position: relative;
  padding: 1px;
}
.battery::before {
  content: "";
  display: block;
  height: 100%;
  width: 78%;
  background: white;
  border-radius: 1px;
}
.battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
  border-radius: 0 2px 2px 0;
}

.clock-area {
  text-align: center;
  margin-top: 25px;
  text-shadow: 0 2px 12px #0003;
}

.date {
  font-size: 19px;
  font-weight: 570;
  letter-spacing: -.4px;
}

.clock {
  margin-top: 0;
  font-size: clamp(76px, 21vw, 100px);
  line-height: 1.12;
  font-weight: 300;
  letter-spacing: -5px;
  font-variant-numeric: tabular-nums;
}

.searchbar {
  height: 49px;
  margin: 26px 27px 0;
  border-radius: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 19px;
  background: rgba(242, 239, 231, .52);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  color: white;
  font-size: 17px;
  text-shadow: 0 1px 4px #0002;
}

.search-icon {
  font-size: 23px;
  font-weight: 300;
}

.apps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 6px;
  row-gap: 25px;
  padding: 30px 18px 0;
}

.app {
  border: 0;
  background: none;
  color: white;
  min-width: 0;
  padding: 0;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}

.app-icon {
  width: min(68px, 17vw);
  height: min(68px, 17vw);
  max-width: 68px;
  max-height: 68px;
  min-width: 54px;
  min-height: 54px;
  margin: auto;
  border-radius: 22%;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 3px 9px rgba(0,0,0,.12);
  font-size: 35px;
  line-height: 1;
  transition: transform .12s;
}

.app:active .app-icon { transform: scale(.91); }

.app-label {
  display: block;
  margin-top: 7px;
  font-size: 12px;
  font-weight: 450;
  line-height: 15px;
  white-space: nowrap;
  text-shadow: 0 1px 5px #0008;
}

.wa { background: #25d366; }
.ig {
  background: radial-gradient(circle at 30% 105%,
  #ffdc80 0%, #fcaf45 18%, #f77737 35%,
  #e1306c 58%, #c13584 73%, #833ab4 100%);
}
.spotify { background: #1ed760; color: #101010; }
.youtube { background: #ff0033; }
.notes { background: linear-gradient(#fff,#f0f0f0); color: #efbd36; }
.xapp { background: #111; }
.pin { background: #e60023; }
.sudoku { background: #dfe8fa; color: #4e75c9; }
.photos { background: #fff; }
.safari { background: linear-gradient(145deg,#e4f5ff,#7bc5ff); }
.memo { background: #e9e9ed; color: #888; }

.glyph {
  font-family: Arial, sans-serif;
  font-weight: 500;
}
.photos .glyph {
  background: conic-gradient(#ff453a, #ff9f0a, #ffd60a,
  #30d158, #64d2ff, #0a84ff, #bf5af2, #ff375f);
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  font-size: 43px;
}
.ig .glyph { font-size: 37px; }
.youtube .glyph { font-size: 29px; }
.wa .glyph { font-size: 35px; }
.spotify .glyph { font-size: 37px; }

.dock {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom));
  left: 16px;
  right: 16px;
  min-height: 98px;
  padding: 12px 8px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  border-radius: 29px;
  background: rgba(238, 231, 218, .57);
  border: 1px solid rgba(255,255,255,.17);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
}

.dock .app-label { display: none; }
.dock .app-icon { width: min(61px, 15.5vw); height: min(61px, 15.5vw); }

.home-indicator {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 108px;
  height: 4px;
  border-radius: 9px;
  background: white;
  box-shadow: 0 1px 3px #0004;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: none;
  overflow-y: auto;
  background: #f2f2f7;
  color: #19191d;
  overscroll-behavior: contain;
}
.screen.open { display: block; }

.screen-top {
  padding: 57px 22px 20px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e4e4e9;
}
.back {
  padding: 0;
  margin: 0 0 22px;
  border: 0;
  background: none;
  color: var(--blue);
  font-size: 17px;
}
.screen h2 {
  margin: 0;
  font-size: 31px;
  font-weight: 720;
  letter-spacing: -.8px;
}
.content { padding: 20px 16px 35px; }
.card {
  background: white;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px #00000008;
}
.muted { color: #85858b; font-size: 14px; }
.link {
  display: inline-block;
  margin-top: 10px;
  color: var(--blue);
  text-decoration: none;
}
.home-button {
  display: block;
  margin: 28px auto 0;
  border: 0;
  background: #e2e2e8;
  border-radius: 24px;
  padding: 10px 22px;
  color: #333;
}
.sudoku-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 3px;
  margin-top: 16px;
}
.sudoku-grid button {
  aspect-ratio: 1;
  border: 1px solid #c5c5ca;
  background: white;
  color: #3977cf;
  font-size: 23px;
}
.sudoku-grid button:nth-child(3n) { border-right: 2px solid #777; }
.sudoku-grid button:nth-child(3n+1) { border-left: 2px solid #777; }

@media (min-width: 431px) {
  body { padding: 12px 0; }
  .phone {
    height: min(900px, calc(100dvh - 24px));
    border-radius: 42px;
    border: 7px solid #19191b;
  }
  .home-indicator { bottom: 6px; }
}
</style>
</head>
<body>
<main class="phone">
  <div class="wallpaper"></div>

  <div class="statusbar">
    <span id="statusTime">9:41</span>
    <div class="status-icons">
      <span>◆</span><span>◔</span><span>▮▮</span>
      <span class="battery"></span>
    </div>
  </div>

  <section class="clock-area">
    <div class="date" id="date">Wednesday, October 28</div>
    <div class="clock" id="clock">9:41</div>
  </section>

  <div class="searchbar">
    <span class="search-icon">⌕</span><span>Search</span>
  </div>

  <section class="apps" id="apps"></section>
  <section class="dock" id="dock"></section>
  <div class="home-indicator"></div>

  <section class="screen" id="screen">
    <header class="screen-top">
      <button class="back" onclick="goHome()">‹ &nbsp; Home</button>
      <h2 id="appTitle">App</h2>
    </header>
    <div class="content" id="appContent"></div>
  </section>
</main>

<script>
const applications = [
  {name:"Instagram", glyph:"◎", cls:"ig", desc:"Mavin's Photos"},
  {name:"Spotify", glyph:"♫", cls:"spotify", desc:"Mavin's Playlist"},
  {name:"YouTube", glyph:"▶", cls:"youtube", desc:"aespa — Lemonade"},
  {name:"Notes", glyph:"▤", cls:"notes", desc:"Mavin's Thoughts"},
  {name:"X", glyph:"𝕏", cls:"xapp", desc:"Mavin's private account"},
  {name:"Pinterest", glyph:"P", cls:"pin", desc:"Random Thing About Mavin"},
  {name:"Sudoku", glyph:"▦", cls:"sudoku", desc:"Sudoku demo"},
  {name:"Photos", glyph:"🌈", cls:"photos", desc:"Mavin's Camera Roll", dock:true},
  {name:"WhatsApp", glyph:"☎", cls:"wa", desc:"Mavin's Messages", dock:true},
  {name:"Safari", glyph:"🧭", cls:"safari", desc:"Web browser", dock:true},
  {name:"Memo", glyph:"✎", cls:"memo", desc:"Quick notes", dock:true}
];

function makeApp(app) {
  const button = document.createElement("button");
  button.className = "app";
  button.setAttribute("aria-label", app.name);
  button.innerHTML = `<div class="app-icon ${app.cls}">
    <span class="glyph">${app.glyph}</span>
    </div><span class="app-label">${app.name}</span>`;
  button.addEventListener("click", () => openApp(app));
  return button;
}

applications.forEach(app => {
  document.getElementById(app.dock ? "dock" : "apps")
    .appendChild(makeApp(app));
});

function openApp(app) {
  const screen = document.getElementById("screen");
  const title = document.getElementById("appTitle");
  const content = document.getElementById("appContent");
  title.textContent = app.name;
  content.replaceChildren();

  const card = document.createElement("div");
  card.className = "card";
  const heading = document.createElement("strong");
  heading.textContent = app.desc;
  card.appendChild(heading);
  content.appendChild(card);

  const note = document.createElement("p");
  note.className = "muted";
  note.textContent = "Mavin's iPhone";
  content.appendChild(note);

  if (app.name === "Sudoku") {
    const grid = document.createElement("div");
    grid.className = "sudoku-grid";
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("button");
      cell.textContent = i + 1;
      cell.onclick = () => {
        cell.textContent = cell.textContent === "·" ? i + 1 : "·";
      };
      grid.appendChild(cell);
    }
    content.appendChild(grid);
    note.textContent = "Demo grid — tap a cell to change it.";
  }

  if (app.name === "YouTube") {
    const link = document.createElement("a");
    link.className = "link";
    link.href = "https://www.youtube.com/results?search_query=aespa+Lemonade";
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Search aespa — Lemonade on YouTube ↗";
    content.appendChild(link);
  }

  if (app.name === "Spotify") {
    const link = document.createElement("a");
    link.className = "link";
    link.href = "https://open.spotify.com/";
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Open Spotify ↗";
    content.appendChild(link);
  }

  screen.classList.add("open");
}

function goHome() {
  document.getElementById("screen").classList.remove("open");
}

function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString("en-US", {
    hour:"2-digit", minute:"2-digit", hour12:false
  });
  document.getElementById("clock").textContent = time;
  document.getElementById("statusTime").textContent = time;
  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US", {
      weekday:"long", month:"long", day:"numeric"
    });
}
updateClock();
setInterval(updateClock, 30000);
</script>
</body>
</html>
