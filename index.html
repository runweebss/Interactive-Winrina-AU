
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mavin's iPhone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --white: #fff;
  --glass: rgba(225, 225, 225, .30);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Helvetica Neue", Inter, sans-serif;
  background: #111;
  color: white;
}

.phone {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  min-height: 680px;
  margin: auto;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #537eb8 url("camera-wallpaper.jpg") center center / cover no-repeat;
}

.phone::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    rgba(10, 30, 60, .13),
    transparent 42%,
    rgba(0, 0, 0, .14)
  );
}

/* STATUS BAR */
.statusbar {
  height: 58px;
  padding: 13px 27px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 17px;
  font-weight: 700;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.status-icons svg {
  width: 21px;
  height: 20px;
  fill: white;
}

/* DYNAMIC ISLAND */
.island-row {
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 29px;
}

.island-time {
  font-size: 19px;
  font-weight: 700;
}

.island {
  width: 144px;
  height: 43px;
  border-radius: 30px;
  background: #000;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.island-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.island-icons svg {
  width: 21px;
  height: 20px;
  stroke: white;
  fill: none;
  stroke-width: 2.5;
}

/* WIDGETS */
.widgets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  padding: 15px 18px 0;
}

.widget {
  height: 178px;
  min-width: 0;
  border-radius: 27px;
  padding: 19px 17px;
  background: rgba(39, 53, 76, .76);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  overflow: hidden;
}

.day {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #ff6868;
  margin-bottom: 3px;
}

.date-number {
  font-size: 67px;
  line-height: 1.08;
  font-weight: 300;
  letter-spacing: -3px;
}

.month {
  margin-top: 10px;
  font-size: 15px;
  white-space: nowrap;
}

.weather-city {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
  min-height: 42px;
}

.temperature {
  font-size: 54px;
  line-height: 1.15;
  font-weight: 300;
  letter-spacing: -2px;
  margin-top: 2px;
}

.weather-bottom {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 9px;
  font-size: 14px;
}

.weather-bottom svg {
  width: 23px;
  height: 23px;
  stroke: white;
  fill: none;
  stroke-width: 1.7;
}

/* APP GRID */
.apps {
  position: absolute;
  top: 53.1%;
  left: 0;
  right: 0;
  padding: 0 23px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 22px;
}

.app {
  min-width: 0;
  text-align: center;
  color: white;
  border: 0;
  padding: 0;
  background: none;
  font: inherit;
  cursor: pointer;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
}

.app-icon {
  width: min(100%, 70px);
  aspect-ratio: 1;
  margin: 0 auto 7px;
  border-radius: 21%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,.19);
  background: white;
  text-shadow: none;
}

.app-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.app-label {
  display: block;
  font-size: 12px;
  line-height: 1.25;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* DOCK */
.dock {
  position: absolute;
  left: 15px;
  right: 15px;
  bottom: 91px;
  height: 91px;
  border-radius: 29px;
  padding: 10px 13px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  gap: 10px;
  background: rgba(220, 220, 220, .37);
  border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(25px) saturate(150%);
  -webkit-backdrop-filter: blur(25px) saturate(150%);
}

.dock .app-icon {
  width: 100%;
  max-width: 68px;
  margin: auto;
  border-radius: 22%;
}

.dock .app-label {
  display: none;
}

.badge {
  position: absolute;
  top: -5px;
  right: -4px;
  background: #ff3b30;
  color: white;
  border: 2px solid white;
  border-radius: 20px;
  min-width: 27px;
  height: 27px;
  padding: 0 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  text-shadow: none;
}

/* BOTTOM BROWSER BAR */
.browser-bar {
  position: absolute;
  bottom: 17px;
  left: 28px;
  right: 28px;
  height: 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.browser-button {
  height: 46px;
  width: 46px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(220,220,220,.42);
  border: 1px solid rgba(255,255,255,.3);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.address-bar {
  height: 46px;
  flex: 1;
  min-width: 0;
  border-radius: 25px;
  background: rgba(220,220,220,.45);
  border: 1px solid rgba(255,255,255,.3);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 7px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
}

.address-bar span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.address-bar svg,
.browser-button svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: white;
  stroke-width: 2.5;
  flex-shrink: 0;
}

/* APP SCREEN */
.app-screen {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: none;
  background: #f7f7f9;
  color: #171717;
  padding: 65px 22px 30px;
}

.app-screen.open {
  display: block;
}

.app-screen h2 {
  font-size: 28px;
  margin-top: 35px;
}

.app-screen p {
  color: #666;
  line-height: 1.6;
}

.back-button {
  border: 0;
  border-radius: 18px;
  background: #e5e5ea;
  padding: 10px 16px;
  font-size: 15px;
  cursor: pointer;
}

@media (max-height: 740px) {
  .widgets { padding-top: 8px; }
  .widget { height: 150px; padding: 14px; }
  .date-number { font-size: 57px; }
  .apps { top: 48%; row-gap: 13px; }
  .dock { bottom: 75px; height: 78px; }
  .browser-bar { bottom: 9px; }
}

@media (min-width: 500px) {
  .phone {
    height: 900px;
    margin: 20px auto;
    border-radius: 35px;
    border: 5px solid #292929;
  }
}
</style>
</head>

const apps = [
  {name:"Catatan", icon:"notes"},
  {name:"Galeri", icon:"photos"},
  {name:"Pengaturan", icon:"settings"},
  {name:"Gardenscapes", icon:"garden"},
  {name:"Naver", icon:"naver", url:"https://www.naver.com"},
  {name:"YouTube", icon:"youtube", url:"https://www.youtube.com"},
  {name:"Instagram", icon:"instagram", url:"https://www.instagram.com"},
  {name:"X", icon:"x", url:"https://x.com"}
];

const dockApps = [
  {name:"Safari", icon:"safari", url:"https://www.google.com"},
  {name:"Kamera", icon:"camera"},
  {name:"LINE", icon:"line", badge:"19", url:"https://line.me"},
  {name:"Musik", icon:"music"}
];

function createApp(app, inDock=false) {
  const button = document.createElement("button");
  button.className = "app";
  button.setAttribute("aria-label", app.name);

  const iconBox = document.createElement("div");
  iconBox.className = "app-icon";
  iconBox.innerHTML = icons[app.icon];

  if (app.badge) {
    iconBox.style.position = "relative";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = app.badge;
    iconBox.appendChild(badge);
  }

  const label = document.createElement("span");
  label.className = "app-label";
  label.textContent = app.name;

  button.append(iconBox, label);
  button.addEventListener("click", () => {
    if (app.url) {
      window.open(app.url, "_blank", "noopener,noreferrer");
    } else {
      openApp(app.name);
    }
  });

  return button;
}

const grid = document.getElementById("appsGrid");
apps.forEach(app => grid.appendChild(createApp(app)));

const dock = document.getElementById("dock");
dockApps.forEach(app => dock.appendChild(createApp(app, true)));

function openApp(name) {
  document.getElementById("screenTitle").textContent = name;
  const descriptions = {
    "Catatan": "Tulis ide, daftar belanja, atau catatan harianmu di sini. ✍️",
    "Kamera": "Kamera ini hanya simulasi tampilan.",
    "Musik": "Perpustakaan musik kamu akan muncul di sini. 🎵",
    "Gardenscapes": "Selamat datang di kebunmu! 🌿"
  };
  document.getElementById("screenText").textContent =
    descriptions[name] || "Ini adalah simulasi tampilan aplikasi.";
  document.getElementById("appScreen").classList.add("open");
}

function closeApp() {
  document.getElementById("appScreen").classList.remove("open");
}

/* Tanggal otomatis mengikuti perangkat */
const now = new Date();
const weekdays = ["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"];
const months = ["Januari","Februari","Maret","April","Mei","Juni",
                "Juli","Agustus","September","Oktober","November","Desember"];

document.getElementById("dayName").textContent = weekdays[now.getDay()];
document.getElementById("dateNumber").textContent = now.getDate();
document.getElementById("monthName").textContent =
  months[now.getMonth()] + " " + now.getFullYear();

function updateClock() {
  const d = new Date();
  const time = d.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).replace(".", ":");
  document.getElementById("statusTime").textContent = time;
  document.getElementById("islandTime").textContent = time;
}
updateClock();
setInterval(updateClock, 30000);
</script>
