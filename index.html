
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101016">
<title>iPhone Home Screen</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --icon-size: clamp(54px, 15vw, 76px);
  --label-size: 12px;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  color: white;
  background: #222;
}

.screen {
  position: relative;
  width: 100%;
  height: 100dvh;
  max-width: 430px;
  margin: auto;
  overflow: hidden;
  isolation: isolate;
}

/* WALLPAPER */
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-image: url(
    "https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/54ba421f3b21b5398ae8675c870aacdbade700b9/camera-wallpaper.jpg"
  );
  background-position: center;
  background-size: cover;
}

.wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .05);
}

/* HOME SCREEN LAYOUT */
.home {
  position: absolute;
  inset: 0;
  padding:  max(42px, env(safe-area-inset-top))
           7% max(25px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* WEATHER */
.weather {
  flex-shrink: 0;
  height: clamp(132px, 25vh, 190px);
  padding: 18px;
  border-radius: 28px;
  background: rgba(125, 116, 99, .78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-shadow: 0 1px 3px #0002;
}

.weather-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.city {
  font-size: 15px;
}

.temp {
  font-size: 46px;
  font-weight: 300;
  line-height: 1.15;
}

.weather-right {
  text-align: right;
  font-size: 13px;
  line-height: 1.5;
}

.forecast {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  text-align: center;
  font-size: 10px;
  gap: 2px;
}

.forecast-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.forecast-icon {
  font-size: 16px;
}

/* APP GRID */
.app-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: auto auto auto;
  column-gap: 10px;
  row-gap: 22px;
  align-items: start;
}

.app {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  min-width: 0;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.icon {
  width: 100%;
  max-width: var(--icon-size);
  aspect-ratio: 1;
  border-radius: 22%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  box-shadow: 0 3px 9px #00000018;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

.label {
  font-size: var(--label-size);
  color: white;
  white-space: nowrap;
  line-height: 1.2;
  text-shadow: 0 1px 4px #0009;
}

.badge {
  position: absolute;
  top: -6px;
  right: -5px;
  min-width: 23px;
  height: 23px;
  padding: 0 5px;
  display: grid;
  place-items: center;
  background: #ff3b30;
  border-radius: 50%;
  border: 1px solid #ffffff35;
  font-size: 12px;
  font-weight: 600;
  z-index: 2;
}

/* WHATSAPP */
.whatsapp .icon {
  background: #20cf65;
}

.whatsapp .icon img {
  padding: 12%;
  object-fit: contain;
}

/* CALENDAR */
.calendar .icon {
  background: linear-gradient(
    to bottom, #ffcc27 0 20%, white 20% 100%
  );
  color: #333;
  overflow: hidden;
}

.calendar .day {
  position: absolute;
  top: 6%;
  font-size: 12px;
  color: white;
  font-weight: 600;
}

.calendar .date {
  font-size: 34px;
  font-weight: 600;
  margin-top: 13px;
}

/* INSTAGRAM */
.instagram .icon {
  background: linear-gradient(
    35deg, #ffd776 0%, #ff7a25 25%,
    #fa2875 55%, #c135d5 75%, #6554df 100%
  );
}

.instagram .icon img {
  padding: 15%;
  object-fit: contain;
}

/* X */
.xapp .icon {
  background: #000;
}

.xapp .icon img {
  padding: 25%;
  object-fit: contain;
}

/* MUSIC WIDGET */
.music-widget {
  grid-column: 3 / 5;
  grid-row: 1 / 3;
  height: calc(var(--icon-size) * 2 + 48px);
  border-radius: 24px;
  padding: 13px;
  background: linear-gradient(145deg, #a93aff, #6410cb);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 5px 15px #0002;
  overflow: hidden;
}

.music-cover {
  width: 56%;
  max-width: 90px;
  aspect-ratio: 1;
  border-radius: 14px;
  background: linear-gradient(135deg, #181818, #555);
  display: grid;
  place-items: center;
  font-size: 34px;
}

.music-title {
  font-size: 13px;
  font-weight: 600;
}

.music-subtitle {
  font-size: 12px;
  opacity: .85;
  margin-top: 5px;
}

.play {
  width: fit-content;
  padding: 8px 13px;
  border-radius: 25px;
  background: #ffffff28;
  font-size: 12px;
}

/* BOTTOM APPS */
.spotify .icon {
  background: #000;
}

.spotify .icon img {
  padding: 15%;
  object-fit: contain;
}

.photos .icon {
  background: white;
}

.photos .flower {
  font-size: 43px;
  background: conic-gradient(
    #ff554f, #ffbd35, #8bda58,
    #45c9c5, #5587f2, #a76bf2,
    #ff554f
  );
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.notes .icon {
  background: linear-gradient(
    to bottom, #ffce3c 0 20%, white 20% 100%
  );
}

.note-lines {
  width: 65%;
  height: 40%;
  margin-top: 12%;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 8px,
    #b8b8b8 9px 11px
  );
}

.youtube .icon {
  background: white;
}

.youtube .icon img {
  padding: 17%;
  object-fit: contain;
}

/* DOCK */
.dock {
  margin-top: auto;
  flex-shrink: 0;
  min-height: calc(var(--icon-size) + 23px);
  border-radius: 29px;
  background: rgba(235, 228, 215, .35);
  border: 1px solid #ffffff22;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  padding: 10px 5px;
}

.dock .icon {
  width: 100%;
  max-width: var(--icon-size);
  background: #f6f5f7;
  color: #25252a;
  font-size: 32px;
}

.dock .app {
  width: 100%;
}

.camera-symbol {
  font-size: 35px;
}

.calc-symbol {
  color: #ff9f0a;
  background: #292929 !important;
}

.gmail-symbol {
  font-size: 35px;
  font-weight: 800;
  background: white !important;
  color: #e94235;
}

.settings-symbol {
  color: white !important;
  background: #85858e !important;
}

/* SMALL PHONES */
@media (max-width: 370px) {
  .home {
    padding-left: 6%;
    padding-right: 6%;
    gap: 20px;
  }

  .app-grid {
    column-gap: 7px;
    row-gap: 19px;
  }

  .weather {
    padding: 15px;
  }

  .music-widget {
    padding: 10px;
    border-radius: 20px;
  }

  .label {
    font-size: 10px;
  }
}

@media (max-height: 700px) {
  .home {
    gap: 15px;
    padding-top: 25px;
    padding-bottom: 14px;
  }

  .weather {
    height: 125px;
  }

  .app-grid {
    row-gap: 12px;
  }

  .dock {
    min-height: 72px;
  }
}
</style>
</head>

<body>
<div class="screen">
  <div class="wallpaper"></div>

  <main class="home">

    <section class="weather">
      <div class="weather-top">
        <div>
          <div class="city">Seoul</div>
          <div class="temp">24°</div>
        </div>
        <div class="weather-right">
          ☀️<br>
          Cerah<br>
          H:26° L:18°
        </div>
      </div>

      <div class="forecast">
        <div class="forecast-item">
          <span>2 PM</span><span class="forecast-icon">☀️</span><span>25°</span>
        </div>
        <div class="forecast-item">
          <span>3 PM</span><span class="forecast-icon">☀️</span><span>26°</span>
        </div>
        <div class="forecast-item">
          <span>4 PM</span><span class="forecast-icon">🌤️</span><span>25°</span>
        </div>
        <div class="forecast-item">
          <span>5 PM</span><span class="forecast-icon">☀️</span><span>24°</span>
        </div>
        <div class="forecast-item">
          <span>6 PM</span><span class="forecast-icon">🌤️</span><span>23°</span>
        </div>
        <div class="forecast-item">
          <span>7 PM</span><span class="forecast-icon">☁️</span><span>22°</span>
        </div>
      </div>
    </section>

    <section class="app-grid">

      <div class="app whatsapp">
        <div class="icon">
          <img src="https://cdn.simpleicons.org/whatsapp/FFFFFF" alt="WhatsApp">
        </div>
        <span class="label">WhatsApp</span>
      </div>

      <div class="app calendar">
        <div class="icon">
          <span class="day">Tue</span>
          <span class="date">9</span>
        </div>
        <span class="label">Calendar</span>
      </div>

      <div class="music-widget">
        <div class="music-cover">♫</div>
        <div>
          <div class="music-title">Sleep Sounds</div>
          <div class="music-subtitle">Sleep</div>
        </div>
        <div class="play">▶ Play</div>
      </div>

      <div class="app instagram">
        <div class="icon">
          <span class="badge">6</span>
          <img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="Instagram">
        </div>
        <span class="label">Instagram</span>
      </div>

      <div class="app xapp">
        <div class="icon">
          <img src="https://cdn.simpleicons.org/x/FFFFFF" alt="X">
        </div>
        <span class="label">X</span>
      </div>

      <div class="app spotify">
        <div class="icon">
          <img src="https://cdn.simpleicons.org/spotify/1ED760" alt="Spotify">
        </div>
        <span class="label">Spotify</span>
      </div>

      <div class="app photos">
        <div class="icon">
          <span class="flower">✿</span>
        </div>
        <span class="label">Photos</span>
      </div>

      <div class="app notes">
        <div class="icon">
          <div class="note-lines"></div>
        </div>
        <span class="label">Notes</span>
      </div>

      <div class="app youtube">
        <div class="icon">
          <span class="badge">4</span>
          <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube">
        </div>
        <span class="label">YouTube</span>
      </div>

    </section>

    <nav class="dock">
      <div class="app">
        <div class="icon camera-symbol">📷</div>
      </div>

      <div class="app">
        <div class="icon calc-symbol">▦</div>
      </div>

      <div class="app">
        <div class="icon gmail-symbol">M</div>
      </div>

      <div class="app">
        <div class="icon settings-symbol">⚙</div>
      </div>
    </nav>

  </main>
</div>
</body>
</html>
