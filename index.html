
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavin's iPhone</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #17171b;
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", sans-serif;
  color: white;
}

.phone {
  width: min(100%, 390px);
  height: min(844px, 100dvh);
  min-height: 620px;
  position: relative;
  overflow: hidden;
  background: #222;
}

.wallpaper {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#0002, #0005),
    url("camera-wallpaper.jpg") center / cover no-repeat;
}

.status {
  position: relative;
  display: flex;
  justify-content: space-between;
  padding: 14px 25px 0;
  font-size: 14px;
  font-weight: 600;
}

.clock {
  position: relative;
  text-align: center;
  margin-top: 55px;
  text-shadow: 0 2px 8px #0008;
}

.date { font-size: 18px; }
.time { font-size: 68px; font-weight: 300; }

.search {
  position: relative;
  margin: 35px 25px 0;
  padding: 11px 16px;
  border-radius: 22px;
  background: #ffffff38;
  backdrop-filter: blur(12px);
  font-size: 14px;
}

.apps {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 8px;
  padding: 35px 18px;
}

.app {
  border: 0;
  padding: 0;
  background: transparent;
  color: white;
  font: inherit;
  text-align: center;
  cursor: pointer;
}

.icon {
  width: 53px;
  height: 53px;
  margin: auto auto 6px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--c, #555);
  font-size: 27px;
  box-shadow: 0 3px 8px #0002;
}

.name {
  font-size: 11px;
  text-shadow: 0 1px 4px #000;
}

.dock {
  position: absolute;
  bottom: 18px;
  left: 15px;
  right: 15px;
  padding: 12px 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #ffffff38;
  backdrop-filter: blur(18px);
  border-radius: 25px;
}

.dock .icon { margin-bottom: 0; }

.screen {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: none;
  background: #f7f7f9;
  color: #17171b;
  overflow-y: auto;
}

.screen.open { display: block; }

.screen-head {
  padding: 55px 20px 18px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.back {
  border: 0;
  background: none;
  color: #087cff;
  font-size: 17px;
  padding: 0;
  margin-bottom: 22px;
}

.screen h2 { margin: 0; font-size: 27px; }

.screen-content { padding: 20px; }

.card {
  padding: 16px;
  border-radius: 15px;
  background: white;
  margin-bottom: 12px;
}

.home-button {
  display: block;
  margin: 20px auto;
  padding: 10px 18px;
  border: 0;
  border-radius: 20px;
  background: #e5e5ea;
}
</style>
</head>
<body>
<main class="phone">
  <div class="wallpaper"></div>

  <div class="status">
    <span id="statusTime">9:41</span>
    <span>● ▰ ▰</span>
  </div>

  <div class="clock">
    <div class="date" id="date">Wednesday, October 28</div>
    <div class="time" id="clock">9:41</div>
  </div>

  <div class="search">⌕ &nbsp; Search</div>

  <div class="apps" id="apps"></div>
  <div class="dock" id="dock"></div>

  <section class="screen" id="screen">
    <header class="screen-head">
      <button class="back" onclick="goHome()">‹ Home</button>
      <h2 id="appTitle">App</h2>
    </header>
    <div class="screen-content" id="appContent"></div>
    <button class="home-button" onclick="goHome()">● Home</button>
  </section>
</main>

<script>
const applications = [
  {name:"WhatsApp", icon:"☎", color:"#25D366",
   text:"Messages", dock:true},
  {name:"Instagram", icon:"◎", color:"#D94685",
   text:"Mavin's Photos"},
  {name:"Spotify", icon:"♫", color:"#1DB954",
   text:"Mavin's Playlist"},
  {name:"YouTube", icon:"▶", color:"#FF3030",
   text:"aespa — Lemonade"},
  {name:"Notes", icon:"▤", color:"#F6C84C",
   text:"Mavin's Thoughts"},
  {name:"X", icon:"𝕏", color:"#222",
   text:"Private account"},
  {name:"Pinterest", icon:"P", color:"#BD081C",
   text:"Random Thing About Mavin"},
  {name:"Sudoku", icon:"▦", color:"#5976D9",
   text:"Sudoku game"},
  {name:"Photos", icon:"🌈", color:"#fff",
   text:"Mavin's Camera Roll", dock:true},
  {name:"Safari", icon:"🧭", color:"#DCEEFF",
   text:"Web browser", dock:true},
  {name:"Memo", icon:"✎", color:"#E9E9EB",
   text:"Quick notes", dock:true}
];

function makeApp(app) {
  const button = document.createElement("button");
  button.className = "app";
  button.innerHTML =
    `<div class="icon" style="--c:${app.color}">${app.icon}</div>
     <div class="name">${app.name}</div>`;
  button.onclick = () => openApp(app);
  return button;
}

applications.forEach(app => {
  (app.dock ? document.getElementById("dock") :
    document.getElementById("apps")).appendChild(makeApp(app));
});

function openApp(app) {
  document.getElementById("appTitle").textContent = app.name;
  const content = document.getElementById("appContent");
  content.replaceChildren();

  const card = document.createElement("div");
  card.className = "card";
  card.textContent = app.text;
  content.appendChild(card);

  const info = document.createElement("p");
  info.textContent = "Mavin's iPhone";
  content.appendChild(info);

  if (app.name === "Sudoku") {
    const grid = document.createElement("div");
    grid.style.cssText =
      "display:grid;grid-template-columns:repeat(3,1fr);gap:4px";
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("button");
      cell.textContent = i + 1;
      cell.style.cssText =
        "height:60px;font-size:22px;border:1px solid #aaa;background:white";
      cell.onclick = () => {
        cell.textContent = cell.textContent === "·" ? i + 1 : "·";
      };
      grid.appendChild(cell);
    }
    content.appendChild(grid);
    info.textContent = "Demo grid — tap a cell to change it.";
  }

  if (app.name === "YouTube") {
    const link = document.createElement("a");
    link.href = "https://www.youtube.com/results?search_query=aespa+Lemonade";
    link.target = "_blank";
    link.textContent = "Search aespa — Lemonade on YouTube ↗";
    content.appendChild(link);
  }

  document.getElementById("screen").classList.add("open");
}

function goHome() {
  document.getElementById("screen").classList.remove("open");
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-US",
      {hour:"numeric",minute:"2-digit",hour12:false});
  document.getElementById("statusTime").textContent =
    document.getElementById("clock").textContent;
  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US",
      {weekday:"long",month:"long",day:"numeric"});
}
updateClock();
setInterval(updateClock, 30000);
</script>
</body>
</html>
